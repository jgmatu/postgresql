# Two network zones that share nothing but PostgreSQL.
#
#   zone_a (172.28.10.0/24)  server      <- the only port published, on host loopback
#   zone_b (172.28.20.0/24)  controller  internal: no route out, not even to zone_a
#   postgres is attached to both zones and is the only path between them.
#
# Secrets stay in their zone: the device CA key (ca-keys) is mounted only by
# init, which creates it, and server, which signs CSRs with it; the device
# keys (device-keys) only by controller. Device traffic stays inside that
# container: the children publish on the controller's ROS domain.
#
# This file has no project name. docker/operational and docker/e2e include it
# and each one names its own project, so their volumes stay apart. The subnets
# and the published port are the same, so the two projects cannot run together.
#
# Usage is scripts/run-all.sh, which selects docker/operational.

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: pgdemo:latest
  init: true

services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      zone_a:
        ipv4_address: 172.28.10.10
      zone_b:
        ipv4_address: 172.28.20.10

  # One-shot: roles, schema, partitions, first admin; writes run/demo.env.
  init:
    <<: *app
    command: ["scripts/db-init.sh"]
    volumes:
      - demo-run:/app/run
      - ca-keys:/app/run/ca
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDEMO_PGHOST: postgres
      PGDEMO_PGPORT: "5432"
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?set DEMO_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zone_a

  server:
    <<: *app
    entrypoint: ["/app/entrypoint.sh"]
    command: ["server"]
    volumes:
      - demo-run:/app/run
      - ca-keys:/app/run/ca
    environment:
      PGDEMO_LISTEN_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8443"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      zone_a:
        ipv4_address: 172.28.10.20

  controller:
    <<: *app
    entrypoint: ["/app/entrypoint.sh"]
    command: ["controller"]
    volumes:
      - demo-run:/app/run
      - device-keys:/app/run/devices
    environment:
      PGDEMO_MAX_DEVICES: ${PGDEMO_MAX_DEVICES:-16}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      zone_b:
        ipv4_address: 172.28.20.20

volumes:
  pgdata:
  demo-run:
  ca-keys:
  device-keys:

networks:
  zone_a:
    ipam:
      config:
        - subnet: 172.28.10.0/24
  zone_b:
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24
