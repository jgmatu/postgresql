# The stack that stays. Its volumes are external: `down` and `down -v` leave
# them. scripts/run-all.sh creates them. Removing one is `docker volume rm`.
#
#   docker compose -f docker/operational/compose.yaml --env-file docker/operational/.env up --build

name: pgdemo

include:
  - path: ../compose.yaml

# The factory is not in the shared file. The end-to-end project does not
# include this one, so its enrollment stays on the demo CA.
services:
  factory:
    image: pgdemo:latest
    init: true
    entrypoint: ["/app/entrypoint.sh"]
    command: ["factory"]
    restart: unless-stopped
    volumes:
      - factory-key:/app/run/factory
      - factory-cert:/app/run/factory-cert
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/9443"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      zone_factory:
        ipv4_address: 172.28.30.10

  controller:
    networks:
      zone_b:
        ipv4_address: 172.28.20.20
      zone_factory:
        ipv4_address: 172.28.30.20
    volumes:
      - demo-run:/app/run
      - device-keys:/app/run/devices
      - factory-cert:/app/run/factory-cert:ro
      - manager-keys:/app/run/controller
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      PGDEMO_MAX_DEVICES: ${PGDEMO_MAX_DEVICES:-16}
      PGDEMO_FACTORY: 172.28.30.10:9443
      PGDEMO_DOCKER_SPAWN: "1"
      PGDEMO_DOCKER_IMAGE: pgdemo:latest
      PGDEMO_DOCKER_NETWORK: pgdemo_zone_b
      PGDEMO_DOCKER_FACTORY_NETWORK: pgdemo_zone_factory
      PGDEMO_DOCKER_PEER: 172.28.20.20
      PGDEMO_FACTORY_CERT_VOLUME: pgdemo_factory-cert
      PGDEMO_MANAGER_VOLUME: pgdemo_manager-keys
    depends_on:
      init:
        condition: service_completed_successfully
      factory:
        condition: service_healthy

  # Declared so an attached `up` and `logs -f` follow the containers the
  # controller creates. scale 0 and the absence of a config-hash keep Compose
  # from creating a container or from adopting the running workers.
  # network_mode none adds no network. The entrypoint exits if Compose ever
  # does create one, so it cannot become a device.
  worker:
    image: pgdemo:latest
    scale: 0
    network_mode: none
    restart: "no"
    entrypoint: ["true"]

volumes:
  pgdata:
    name: pgdemo_pgdata
    external: true
  demo-run:
    name: pgdemo_demo-run
    external: true
  ca-keys:
    name: pgdemo_ca-keys
    external: true
  device-keys:
    name: pgdemo_device-keys
    external: true
  factory-key:
    name: pgdemo_factory-key
    external: true
  factory-cert:
    name: pgdemo_factory-cert
    external: true
  manager-keys:
    name: pgdemo_manager-keys
    external: true

networks:
  zone_factory:
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
