<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img">
  <title>Operational Network</title>
  <desc>Three bridges. postgres and seaweed are each one dual-homed container and do not route. Private keys stay in the namespace that uses them.</desc>
  <defs>
    <filter id="soft" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1400" height="940" fill="#0F172A"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">
    <g filter="url(#soft)">
      <rect x="16" y="16" width="333" height="48" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="361" y="16" width="333" height="48" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="706" y="16" width="333" height="48" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="1051" y="16" width="333" height="48" rx="10" fill="#1E293B" stroke="#334155"/>
    </g>
    <circle cx="36" cy="40" r="5" fill="#38BDF8"/>
    <circle cx="381" cy="40" r="5" fill="#10B981"/>
    <circle cx="726" cy="40" r="5" fill="#A855F7"/>
    <circle cx="1071" cy="40" r="5" fill="#F59E0B"/>
    <text x="186" y="45" text-anchor="middle">3 Isolated Bridges (internal: true)</text>
    <text x="531" y="45" text-anchor="middle">Dual-Homed Stores, Zero Routing</text>
    <text x="876" y="45" text-anchor="middle">Dynamic Worker Provisioning (docker.sock)</text>
    <text x="1222" y="45" text-anchor="middle">Strict Private-Key Custody (RO Certs)</text>
  </g>

  <g filter="url(#soft)">
    <rect x="16" y="78" width="390" height="812" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="422" y="78" width="546" height="300" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="422" y="394" width="546" height="496" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="984" y="78" width="400" height="812" rx="14" fill="#1E293B" stroke="#334155"/>
  </g>

  <!-- Zone A -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="36" y="108" fill="#F8FAFC" font-size="16" font-weight="600">Zone A</text>
    <text x="36" y="128" fill="#94A3B8" font-size="12">172.28.10.0/24 · analysis</text>

    <rect x="36" y="146" width="350" height="52" rx="8" fill="#0B1220" stroke="#38BDF8"/>
    <text x="52" y="168" fill="#38BDF8" font-size="13" font-weight="600">host</text>
    <text x="52" y="186" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">127.0.0.1:8080</text>

    <rect x="36" y="220" width="250" height="120" rx="8" fill="#0B1220" stroke="#38BDF8"/>
    <text x="52" y="244" fill="#38BDF8" font-size="13" font-weight="600">server</text>
    <text x="52" y="266" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.10.20:8443</text>
    <text x="52" y="288" fill="#94A3B8" font-size="12">SQL and NOTIFY</text>
    <text x="52" y="308" fill="#94A3B8" font-size="12">to 172.28.10.10</text>
    <text x="52" y="328" fill="#7DD3FC" font-size="11">8443 is the published port</text>

    <rect x="36" y="360" width="350" height="84" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="52" y="384" fill="#F8FAFC" font-size="13" font-weight="600">init · exits</text>
    <text x="52" y="406" fill="#94A3B8" font-size="12">This zone only.</text>
    <text x="52" y="426" fill="#FDE68A" font-size="12">Creates ca.key, then stops.</text>

    <rect x="36" y="464" width="350" height="112" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="52" y="488" fill="#F59E0B" font-size="13" font-weight="600" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_ca-keys</text>
    <text x="52" y="510" fill="#FDE68A" font-size="12">ca.key</text>
    <text x="52" y="530" fill="#E2E8F0" font-size="12">Mounted by init and server.</text>
    <text x="52" y="550" fill="#E2E8F0" font-size="12">Not by controller or worker.</text>

    <rect x="36" y="596" width="350" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="52" y="622" fill="#94A3B8" font-size="12">No route from this zone</text>
    <text x="52" y="642" fill="#94A3B8" font-size="12">to 172.28.20.0/24.</text>
  </g>

  <path d="M 160 198 V 220" fill="none" stroke="#38BDF8" stroke-width="1.75" marker-end="url(#arrow-cyan)"/>
  <text x="172" y="214" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">HTTPS</text>

  <!-- Shared stores -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="442" y="106" fill="#F8FAFC" font-size="16" font-weight="600">Shared stores</text>
    <text x="442" y="126" fill="#94A3B8" font-size="12">One container each. Two addresses. Not gateways.</text>

    <rect x="442" y="148" width="250" height="176" rx="8" fill="#0B1220" stroke="#10B981"/>
    <text x="458" y="172" fill="#10B981" font-size="13" font-weight="600">postgres</text>
    <text x="458" y="192" fill="#94A3B8" font-size="12">one database</text>
    <text x="458" y="216" fill="#A7F3D0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.10.10</text>
    <text x="458" y="236" fill="#6EE7B7" font-size="11">zone A</text>
    <text x="458" y="258" fill="#A7F3D0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.20.10</text>
    <text x="458" y="278" fill="#6EE7B7" font-size="11">zone B</text>
    <text x="458" y="304" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_pgdata</text>

    <rect x="708" y="148" width="240" height="176" rx="8" fill="#0B1220" stroke="#10B981"/>
    <text x="724" y="172" fill="#10B981" font-size="13" font-weight="600">seaweed</text>
    <text x="724" y="192" fill="#94A3B8" font-size="12">one object store</text>
    <text x="724" y="216" fill="#A7F3D0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.10.11</text>
    <text x="724" y="236" fill="#6EE7B7" font-size="11">zone A</text>
    <text x="724" y="258" fill="#A7F3D0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.20.11</text>
    <text x="724" y="278" fill="#6EE7B7" font-size="11">zone B</text>
    <text x="724" y="304" fill="#E2E8F0" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_seaweed</text>

    <text x="442" y="356" fill="#6EE7B7" font-size="12">A second interface does not forward. 8333 is not published.</text>
  </g>

  <path d="M 286 268 H 442" fill="none" stroke="#10B981" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <path d="M 442 294 H 286" fill="none" stroke="#10B981" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="300" y="260" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">SQL</text>
  <text x="300" y="310" fill="#6EE7B7" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">NOTIFY</text>

  <!-- Zone B -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="442" y="422" fill="#F8FAFC" font-size="16" font-weight="600">Zone B</text>
    <text x="442" y="442" fill="#94A3B8" font-size="12">172.28.20.0/24 · internal · no route to zone A</text>

    <rect x="442" y="462" width="310" height="176" rx="8" fill="#0B1220" stroke="#A855F7"/>
    <text x="458" y="486" fill="#C084FC" font-size="13" font-weight="600">controller</text>
    <text x="458" y="508" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.20.20</text>
    <text x="580" y="508" fill="#94A3B8" font-size="11">zone B</text>
    <text x="458" y="528" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.30.20</text>
    <text x="580" y="528" fill="#94A3B8" font-size="11">zone factory</text>
    <text x="458" y="552" fill="#E9D5FF" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">docker.sock</text>
    <text x="458" y="572" fill="#FDE68A" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">manager.key</text>
    <text x="458" y="592" fill="#FDE68A" font-size="12">devices.puf · fork path</text>
    <text x="458" y="616" fill="#6EE7B7" font-size="12">SQL · NOTIFY · 172.28.20.10</text>

    <rect x="442" y="708" width="310" height="156" rx="8" fill="#0B1220" stroke="#A855F7"/>
    <text x="458" y="732" fill="#C084FC" font-size="13" font-weight="600" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo-worker-&lt;name&gt;</text>
    <text x="458" y="754" fill="#94A3B8" font-size="12">No fixed address.</text>
    <text x="458" y="776" fill="#FDE68A" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_puf_&lt;name&gt;</text>
    <text x="458" y="796" fill="#FDE68A" font-size="12">seed derives P-384</text>
    <text x="458" y="818" fill="#7DD3FC" font-size="12">ROS 2 to 172.28.20.20</text>
    <text x="458" y="838" fill="#94A3B8" font-size="12">Also joined to zone_factory.</text>
  </g>

  <path d="M 480 638 V 708" fill="none" stroke="#A855F7" stroke-width="1.75" marker-end="url(#arrow-purple)"/>
  <text x="492" y="678" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">creates</text>
  <path d="M 620 638 V 708" fill="none" stroke="#F59E0B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="632" y="678" fill="#F59E0B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">ro manager.crt</text>

  <!-- Zone factory -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="1004" y="108" fill="#F8FAFC" font-size="16" font-weight="600">Zone Factory</text>
    <text x="1004" y="128" fill="#94A3B8" font-size="12">172.28.30.0/24 · internal</text>

    <rect x="1004" y="152" width="360" height="176" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="1020" y="176" fill="#F59E0B" font-size="13" font-weight="600">factory</text>
    <text x="1020" y="198" fill="#E2E8F0" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">172.28.30.10:9443</text>
    <text x="1020" y="218" fill="#94A3B8" font-size="12">Not published on the host.</text>
    <text x="1020" y="242" fill="#FDE68A" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_factory-key</text>
    <text x="1020" y="262" fill="#FDE68A" font-size="12">root.key stays in this container.</text>
    <text x="1020" y="286" fill="#E2E8F0" font-size="12">Controller and worker call :9443.</text>
    <text x="1020" y="308" fill="#94A3B8" font-size="11">They do not mount root.key.</text>

    <rect x="1004" y="480" width="360" height="108" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="1020" y="504" fill="#F59E0B" font-size="13" font-weight="600" font-family="JetBrains Mono, ui-monospace, monospace">pgdemo_factory-cert</text>
    <text x="1020" y="526" fill="#FDE68A" font-size="12">Factory writes root.crt.</text>
    <text x="1020" y="546" fill="#E2E8F0" font-size="12">Read only on controller and worker.</text>
    <text x="1020" y="568" fill="#94A3B8" font-size="11">The key is not in this volume.</text>

    <rect x="1004" y="720" width="360" height="120" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="1020" y="744" fill="#FDE68A" font-size="12" font-weight="600">manager.crt is read only.</text>
    <text x="1020" y="766" fill="#E2E8F0" font-size="12">It comes from the controller.</text>
    <text x="1020" y="788" fill="#E2E8F0" font-size="12">manager.key never leaves it.</text>
    <text x="1020" y="810" fill="#E2E8F0" font-size="12">root.key never leaves factory.</text>
  </g>

  <path d="M 1004 520 H 752" fill="none" stroke="#F59E0B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="860" y="512" fill="#F59E0B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">ro root.crt</text>
  <path d="M 1004 588 H 976 V 800 H 752" fill="none" stroke="#F59E0B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="800" y="792" fill="#F59E0B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">ro root.crt</text>

  <text x="700" y="924" text-anchor="middle" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13">postgres and seaweed do not route between bridges. A private key stays in the namespace that uses it.</text>
</svg>
