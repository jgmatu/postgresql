<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DatabaseManager</title>
  <desc id="desc">Three columns: caller threads, DatabaseManager split into a query pool and a LISTEN demultiplexer, and PostgreSQL backends. acquire checks out one session and the Lease returns it. The listener uses a separate socket and never holds a pool lease.</desc>
  <defs>
    <filter id="soft" x="-12%" y="-16%" width="124%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#0F172A"/>

  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">
    <g filter="url(#soft)">
      <rect x="20" y="16" width="330" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="364" y="16" width="330" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="708" y="16" width="330" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="1052" y="16" width="328" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
    </g>
    <circle cx="44" cy="42" r="5" fill="#38BDF8"/>
    <circle cx="388" cy="42" r="5" fill="#F59E0B"/>
    <circle cx="732" cy="42" r="5" fill="#A855F7"/>
    <circle cx="1076" cy="42" r="5" fill="#10B981"/>
    <text x="190" y="46" text-anchor="middle">Exception-Safe RAII Lease</text>
    <text x="534" y="46" text-anchor="middle">Zero Lock Contention on I/O</text>
    <text x="878" y="46" text-anchor="middle">Single-Socket Multiplexing</text>
    <text x="1216" y="46" text-anchor="middle">Transaction-Scoped Roles</text>
  </g>

  <g filter="url(#soft)">
    <rect x="16" y="84" width="420" height="668" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="456" y="84" width="488" height="300" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="456" y="404" width="488" height="348" rx="14" fill="#1E293B" stroke="#334155"/>
    <rect x="964" y="84" width="420" height="668" rx="14" fill="#1E293B" stroke="#334155"/>
  </g>

  <!-- Callers -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="36" y="114" fill="#F8FAFC" font-size="16" font-weight="600">Callers</text>
    <text x="36" y="134" fill="#94A3B8" font-size="12">Each process owns one DatabaseManager.</text>

    <rect x="36" y="152" width="260" height="72" rx="8" fill="#0B1220" stroke="#38BDF8"/>
    <text x="52" y="176" fill="#38BDF8" font-size="13" font-weight="600">pgdemo-server</text>
    <text x="52" y="196" fill="#E2E8F0" font-size="12">HTTP connection threads</text>
    <text x="52" y="214" fill="#94A3B8" font-size="12">query pool 8</text>

    <rect x="36" y="236" width="260" height="88" rx="8" fill="#0B1220" stroke="#38BDF8"/>
    <text x="52" y="260" fill="#38BDF8" font-size="13" font-weight="600">pgdemo-controller</text>
    <text x="52" y="280" fill="#E2E8F0" font-size="12">device-queue threads</text>
    <text x="52" y="298" fill="#E2E8F0" font-size="12">plus the spin thread</text>
    <text x="52" y="316" fill="#94A3B8" font-size="12">query pool 17</text>

    <rect x="36" y="344" width="260" height="248" rx="8" fill="#0B1220" stroke="#38BDF8"/>
    <text x="52" y="370" fill="#38BDF8" font-size="13" font-weight="600">One checkout</text>
    <text x="52" y="398" fill="#E2E8F0" font-size="13">acquire()</text>
    <text x="52" y="426" fill="#E2E8F0" font-size="13">Lease</text>
    <text x="52" y="454" fill="#E2E8F0" font-size="13">SQL on get()</text>
    <text x="52" y="482" fill="#E2E8F0" font-size="13">~Lease() · notify_all</text>
    <rect x="52" y="502" width="228" height="68" rx="6" fill="#1C1408" stroke="#F59E0B"/>
    <text x="64" y="526" fill="#F59E0B" font-size="12" font-weight="600">Exception-safe</text>
    <text x="64" y="546" fill="#FDE68A" font-size="12">The destructor runs if the</text>
    <text x="64" y="562" fill="#FDE68A" font-size="12">transaction throws.</text>
  </g>

  <!-- Connection pool -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="476" y="112" fill="#F8FAFC" font-size="16" font-weight="600">ConnectionPool</text>
    <text x="476" y="132" fill="#94A3B8" font-size="12">mu_ guards idle_ only.</text>

    <rect x="476" y="148" width="196" height="108" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="492" y="172" fill="#F59E0B" font-size="13" font-weight="600" font-family="JetBrains Mono, ui-monospace, monospace">mu_ · cv_</text>
    <text x="492" y="194" fill="#FDE68A" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">idle_</text>
    <text x="492" y="214" fill="#FDE68A" font-size="11">empty: cv.wait releases mu_</text>
    <text x="492" y="232" fill="#FDE68A" font-size="11">then pop_back</text>

    <rect x="692" y="148" width="168" height="108" rx="8" fill="#0B1220" stroke="#10B981"/>
    <text x="706" y="172" fill="#10B981" font-size="13" font-weight="600">session</text>
    <text x="706" y="192" fill="#A7F3D0" font-size="12">SQL outside mu_</text>
    <g fill="#064E3B" stroke="#10B981">
      <rect x="706" y="206" width="18" height="16" rx="3"/>
      <rect x="728" y="206" width="18" height="16" rx="3"/>
      <rect x="750" y="206" width="18" height="16" rx="3"/>
      <rect x="772" y="206" width="18" height="16" rx="3"/>
      <rect x="794" y="206" width="18" height="16" rx="3"/>
      <rect x="816" y="206" width="18" height="16" rx="3"/>
    </g>
    <text x="706" y="244" fill="#6EE7B7" font-size="11">8 server · 17 controller</text>

    <rect x="476" y="268" width="384" height="48" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="492" y="288" fill="#FDE68A" font-size="12">ensure_open() reconnects outside mu_.</text>
    <text x="492" y="306" fill="#FDE68A" font-size="12">The new backend pid is published under the lock.</text>

    <rect x="476" y="326" width="384" height="48" rx="8" fill="#0B1220" stroke="#10B981"/>
    <text x="492" y="346" fill="#10B981" font-size="12" font-weight="600">with_role · SET LOCAL ROLE</text>
    <text x="492" y="364" fill="#A7F3D0" font-size="12">The role ends when the transaction ends.</text>
  </g>

  <!-- Listener -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="476" y="432" fill="#F8FAFC" font-size="16" font-weight="600">Listener demultiplexer</text>
    <text x="476" y="452" fill="#94A3B8" font-size="12">Not in the pool. The name ends in -listener.</text>

    <rect x="476" y="468" width="300" height="96" rx="8" fill="#0B1220" stroke="#A855F7"/>
    <text x="492" y="492" fill="#C084FC" font-size="13" font-weight="600">Phase 1 · caller thread</text>
    <text x="492" y="514" fill="#E2E8F0" font-size="12">LISTEN, then store callbacks_</text>
    <text x="492" y="534" fill="#E2E8F0" font-size="12">libpqxx handler on this connection</text>
    <text x="492" y="552" fill="#94A3B8" font-size="11">before the jthread exists</text>

    <rect x="476" y="576" width="300" height="100" rx="8" fill="#0B1220" stroke="#A855F7"/>
    <text x="492" y="600" fill="#C084FC" font-size="13" font-weight="600">Phase 2 · std::jthread</text>
    <text x="492" y="622" fill="#E2E8F0" font-size="12">wait_notification() · poll(-1)</text>
    <text x="492" y="642" fill="#E2E8F0" font-size="12">telemetry may take a lease</text>
    <text x="492" y="660" fill="#94A3B8" font-size="11">controller callback only queues</text>

    <rect x="476" y="688" width="384" height="48" rx="8" fill="#1C1408" stroke="#F59E0B"/>
    <text x="492" y="708" fill="#FDE68A" font-size="12">A later register_listen_async throws logic_error.</text>
    <text x="492" y="726" fill="#FDE68A" font-size="12">A second run_listener_loop() returns.</text>
  </g>

  <!-- PostgreSQL -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="984" y="114" fill="#F8FAFC" font-size="16" font-weight="600">PostgreSQL</text>
    <text x="984" y="134" fill="#94A3B8" font-size="12">One backend process per session.</text>

    <rect x="984" y="152" width="380" height="200" rx="8" fill="#0B1220" stroke="#10B981"/>
    <text x="1000" y="178" fill="#10B981" font-size="13" font-weight="600">Query backends</text>
    <text x="1000" y="200" fill="#A7F3D0" font-size="12">server 8 · controller 17</text>
    <text x="1000" y="220" fill="#94A3B8" font-size="12">One thread holds a session.</text>
    <text x="1000" y="240" fill="#94A3B8" font-size="12">The mutex is already released.</text>
    <g fill="#064E3B" stroke="#10B981">
      <rect x="1000" y="260" width="36" height="28" rx="4"/>
      <rect x="1044" y="260" width="36" height="28" rx="4"/>
      <rect x="1088" y="260" width="36" height="28" rx="4"/>
      <rect x="1132" y="260" width="36" height="28" rx="4"/>
      <rect x="1176" y="260" width="36" height="28" rx="4"/>
      <rect x="1220" y="260" width="36" height="28" rx="4"/>
    </g>
    <text x="1000" y="316" fill="#6EE7B7" font-size="11" font-family="JetBrains Mono, ui-monospace, monospace">pqxx::connection</text>
    <text x="1000" y="334" fill="#94A3B8" font-size="12">N slots. Not the listener.</text>

    <rect x="984" y="404" width="380" height="320" rx="8" fill="#0B1220" stroke="#A855F7"/>
    <text x="1000" y="432" fill="#C084FC" font-size="13" font-weight="600">Listener backend</text>
    <text x="1000" y="454" fill="#E2E8F0" font-size="12">one socket · name ends in -listener</text>
    <text x="1000" y="478" fill="#94A3B8" font-size="12">Each process registers its own set.</text>
    <text x="1000" y="504" fill="#C084FC" font-size="12" font-weight="600">Server</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#E9D5FF">
      <text x="1000" y="522">telemetry_scalar, telemetry_gps</text>
      <text x="1000" y="538">telemetry_xy, telemetry_xyz</text>
      <text x="1000" y="554">device_events, config_events</text>
      <text x="1000" y="570">error_events, enrollment_requested</text>
      <text x="1000" y="586">enrollment_csr, enrollment_events</text>
    </g>
    <text x="1000" y="614" fill="#C084FC" font-size="12" font-weight="600">Controller</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#E9D5FF">
      <text x="1000" y="632">enrollment_requested, enrollment_events</text>
      <text x="1000" y="648">device_events, config_requested</text>
    </g>
    <text x="1000" y="678" fill="#94A3B8" font-size="12">The controller callback only queues.</text>
    <text x="1000" y="698" fill="#94A3B8" font-size="12">Server telemetry may then acquire.</text>
  </g>

  <!-- acquire: pop idle_ under mu_, then the lock ends -->
  <path d="M 296 394 H 332 V 176 H 476" fill="none" stroke="#38BDF8" stroke-width="1.75" marker-end="url(#arrow-cyan)"/>
  <text x="340" y="168" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">acquire</text>

  <!-- ~Lease pushes the slot back and wakes every waiter -->
  <path d="M 296 478 H 376 V 236 H 476" fill="none" stroke="#38BDF8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-cyan)"/>
  <text x="384" y="220" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">notify_all</text>

  <!-- SQL on the leased session, mutex already dropped -->
  <path d="M 860 214 H 984" fill="none" stroke="#10B981" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <text x="868" y="206" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">SQL</text>

  <!-- poll and NOTIFY stay in the gutter beside the phase boxes -->
  <path d="M 776 612 H 984" fill="none" stroke="#A855F7" stroke-width="1.75" marker-end="url(#arrow-purple)"/>
  <path d="M 984 644 H 776" fill="none" stroke="#A855F7" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="792" y="604" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">poll(-1)</text>
  <text x="792" y="636" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">NOTIFY</text>

  <!-- The listener holds no lease, so a callback may check one out. Stays above the poll lines. -->
  <path d="M 776 580 H 930 V 160 H 860" fill="none" stroke="#38BDF8" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow-cyan)"/>
  <text x="786" y="572" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">may acquire</text>

  <text x="700" y="790" text-anchor="middle" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13">mu_ and listener_mutex_ are not held during SQL or poll(-1).</text>
</svg>
