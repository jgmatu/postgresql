<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img">
  <title>PUF Cryptographic Identity</title>
  <desc>The seed and the P-384 private key stay inside the worker. Only a public key, a CSR, a certificate and a challenge signature cross to the factory and the manager.</desc>
  <rect width="1400" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="736" height="512" rx="16" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="56" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Trust Boundary: Seed &amp; Private Key never leave the worker</text>

  <rect x="48" y="96" width="210" height="156" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="136" y="114" width="34" height="24" rx="4" fill="none" stroke="#B45309" stroke-width="1.75"/>
  <path d="M 143 114 V 106 A 10 10 0 0 1 163 106 V 114" fill="none" stroke="#B45309" stroke-width="1.75"/>
  <circle cx="153" cy="126" r="2" fill="#B45309"/>
  <text x="153" y="162" text-anchor="middle" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">PUF seed</text>
  <text x="153" y="184" text-anchor="middle" fill="#475569" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11">/var/lib/pgdemo/puf/seed</text>
  <text x="153" y="206" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">or devices.puf</text>
  <text x="153" y="228" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">32 bytes, local only</text>

  <rect x="298" y="96" width="210" height="156" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="403" y="158" text-anchor="middle" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">HKDF-SHA384</text>
  <text x="403" y="182" text-anchor="middle" fill="#475569" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">DeviceKey::from_seed</text>
  <text x="403" y="206" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">same seed, same key</text>

  <rect x="548" y="96" width="188" height="156" rx="12" fill="#FFFFFF" stroke="#B45309"/>
  <text x="642" y="150" text-anchor="middle" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Private key</text>
  <text x="642" y="174" text-anchor="middle" fill="#475569" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">secp384r1</text>
  <text x="642" y="198" text-anchor="middle" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">key.pem / factory.key</text>
  <text x="642" y="222" text-anchor="middle" fill="#B45309" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">stays in this box</text>

  <path d="M 258 174 H 298" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M 508 174 H 548" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>

  <text x="48" y="300" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="13">The worker signs the challenge nonce here. The signature leaves. The key does not.</text>

  <text x="1000" y="56" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Network / ROS 2</text>

  <rect x="1000" y="96" width="360" height="156" rx="12" fill="#FFFFFF" stroke="#047857"/>
  <text x="1020" y="132" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Factory</text>
  <text x="1020" y="160" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Signs the CSR it receives.</text>
  <text x="1020" y="184" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Returns the signed certificate.</text>
  <text x="1020" y="212" fill="#475569" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12">cert.pem / factory.crt</text>
  <text x="1020" y="234" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">Never sees the seed or the key.</text>

  <rect x="1000" y="340" width="360" height="156" rx="12" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="1020" y="376" fill="#1D4ED8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Manager</text>
  <text x="1020" y="404" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Sends the challenge nonce.</text>
  <text x="1020" y="428" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">Receives the ECDSA signature</text>
  <text x="1020" y="452" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13">and the certificate.</text>
  <text x="1020" y="476" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12">The private key is not in the reply.</text>

  <path d="M 736 132 H 1000" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="868" y="124" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">public key / CSR</text>

  <path d="M 1000 196 H 736" fill="none" stroke="#047857" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <text x="868" y="188" text-anchor="middle" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">signed certificate</text>

  <path d="M 1000 388 H 760" fill="none" stroke="#1D4ED8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <text x="880" y="380" text-anchor="middle" fill="#1D4ED8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">challenge (nonce)</text>

  <path d="M 760 452 H 1000" fill="none" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="880" y="444" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">ECDSA signature + certificate</text>
</svg>
