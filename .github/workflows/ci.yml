name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build, unit and db tests (Ubuntu 26.04, PostgreSQL 18)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: ci-only-postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DEBIAN_FRONTEND: noninteractive
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ci-only-postgres
      PGDEMO_PGHOST: postgres
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates patch pkg-config \
            libpq-dev libbotan-3-dev libboost-json-dev libssl-dev libgtest-dev libgmock-dev \
            postgresql-client openssl curl jq

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPGDEMO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build -LE db --output-on-failure

      - name: Initialise the database
        run: scripts/db-init.sh --reset

      - name: Database integration tests
        run: |
          . run/demo.env
          export PGDEMO_TEST_SERVER_CONNINFO="host=postgres dbname=pgdemo user=demo_server password=${DEMO_SERVER_DB_PASSWORD}"
          export PGDEMO_TEST_CONTROLLER_CONNINFO="host=postgres dbname=pgdemo user=demo_controller password=${DEMO_CONTROLLER_DB_PASSWORD}"
          ctest --test-dir build -L db --output-on-failure

  docs:
    name: Doxygen documentation (warnings are errors)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Configuring still resolves every find_package, so the build dependencies
      # are needed even though nothing is compiled.
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git ca-certificates patch pkg-config \
            libpq-dev libbotan-3-dev libboost-json-dev libssl-dev \
            doxygen graphviz

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPGDEMO_BUILD_TESTS=OFF

      - name: Build the docs target
        run: cmake --build build --target docs

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/docs/html

  e2e:
    name: end-to-end on docker compose (Robot Framework, two network zones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Robot Framework
        run: pip install -r tests/e2e/requirements.txt

      # The suite builds the image, brings the stack up and tears it down (down -v).
      - name: End-to-end
        run: robot --outputdir e2e-results tests/e2e

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
